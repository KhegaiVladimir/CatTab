<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CatTab — Extension UI</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" />

<link rel="stylesheet" href="styles.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="cat-sprite.jsx"></script>
<script type="text/babel" src="cattab-popup.jsx"></script>
<script type="text/babel" src="cattab-context-menu.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ── Specimen wrappers ───────────────────────────────────────────

// 1. The popup, in the wild — under a fake browser toolbar so it reads
//    as a real extension popover. Fully interactive.
function PopupInBrowserSpecimen() {
  return (
    <div className="specimen">
      <div className="browser-chrome">
        <div className="browser-chrome-popup-anchor">
          <CatTabPopup />
        </div>
      </div>
    </div>
  );
}

// 2. The popup, on its own — pixel-perfect at 320x420.
function PopupBareSpecimen() {
  return (
    <div className="specimen">
      <CatTabPopup />
    </div>
  );
}

// 3. Context menu — interactive, right-click the cat.
function ContextMenuSpecimen() {
  return (
    <div className="specimen">
      <ContextMenuPrototype />
    </div>
  );
}

// 4. Sprite reference — all 4 cat states at large scale.
function SpriteReferenceSpecimen() {
  const states = [
    { v: "idle",  label: "idle" },
    { v: "eat",   label: "eating" },
    { v: "play",  label: "playing" },
    { v: "sleep", label: "sleeping" },
  ];
  return (
    <div className="specimen" style={{ flexDirection: "column", gap: 24 }}>
      <div style={{
        fontFamily: "Geist Mono, monospace",
        fontSize: 11,
        color: "#8A7F70",
        letterSpacing: "0.04em",
        textTransform: "uppercase",
      }}>cheeto · sprite states</div>
      <div style={{ display: "flex", gap: 32 }}>
        {states.map(s => (
          <div key={s.v} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
            <div style={{
              width: 110, height: 110,
              background: "#FBF7F2",
              border: "1px solid #E8DFD0",
              borderRadius: 10,
              display: "grid",
              placeItems: "center",
            }}>
              <PixelCat variant={s.v} scale={6} />
            </div>
            <div style={{
              fontFamily: "Geist Mono, monospace",
              fontSize: 10,
              color: "#8A7F70",
              letterSpacing: "0.04em",
              textTransform: "uppercase",
            }}>{s.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// 5. Color & type tokens — quick design-system reference card.
function TokensSpecimen() {
  const swatches = [
    { name: "bg",       hex: "#FBF7F2" },
    { name: "surface",  hex: "#FFFFFF" },
    { name: "hover",    hex: "#F2EBDF" },
    { name: "line",     hex: "#E8DFD0" },
    { name: "text",     hex: "#2A2520" },
    { name: "muted",    hex: "#8A7F70" },
    { name: "orange",   hex: "#E89464" },
    { name: "pink",     hex: "#E8A0B5" },
    { name: "yellow",   hex: "#E8C766" },
  ];
  return (
    <div className="specimen" style={{ alignItems: "flex-start", justifyContent: "flex-start", padding: 40, flexDirection: "column", gap: 28 }}>
      <div>
        <div style={{
          fontFamily: "Geist Mono, monospace", fontSize: 10,
          color: "#8A7F70", letterSpacing: "0.04em",
          textTransform: "uppercase", marginBottom: 12,
        }}>colors</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, width: 460 }}>
          {swatches.map(s => (
            <div key={s.name} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{
                width: 36, height: 36,
                background: s.hex,
                border: "1px solid #E8DFD0",
                borderRadius: 6,
              }} />
              <div style={{ display: "flex", flexDirection: "column" }}>
                <div style={{ fontSize: 12, color: "#2A2520" }}>{s.name}</div>
                <div style={{
                  fontFamily: "Geist Mono, monospace",
                  fontSize: 10, color: "#8A7F70",
                }}>{s.hex}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div>
        <div style={{
          fontFamily: "Geist Mono, monospace", fontSize: 10,
          color: "#8A7F70", letterSpacing: "0.04em",
          textTransform: "uppercase", marginBottom: 12,
        }}>type</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, width: 460 }}>
          <div style={{ fontFamily: "Geist", fontSize: 15, fontWeight: 500 }}>Cheeto · Geist 15 / 500</div>
          <div style={{ fontFamily: "Geist", fontSize: 13 }}>Hunger · Geist 13 / 400</div>
          <div style={{ fontFamily: "Geist", fontSize: 11, color: "#8A7F70" }}>example.com · Geist 11 muted</div>
          <div style={{ fontFamily: "Geist Mono", fontSize: 11 }}>64% · Geist Mono 11</div>
        </div>
      </div>
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────

function App() {
  return (
    <DesignCanvas title="CatTab" subtitle="pixel cat companion · extension UI">
      <DCSection
        id="popup"
        title="Toolbar popup"
        subtitle="Click the extension icon — a 320×420 popover. Stats decay live; Feed and Play animate the sprite and bump stats."
      >
        <DCArtboard id="popup-context" label="In context · under toolbar" width={620} height={520}>
          <PopupInBrowserSpecimen />
        </DCArtboard>
        <DCArtboard id="popup-bare" label="Bare · 320×420" width={400} height={520}>
          <PopupBareSpecimen />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="context-menu"
        title="In-page context menu"
        subtitle="Right-click directly on Cheeto wherever he is on the page. Click any item to see the cat react."
      >
        <DCArtboard id="ctx" label="Right-click · live" width={580} height={460}>
          <ContextMenuSpecimen />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="system"
        title="Building blocks"
        subtitle="Sprite states and design tokens used across both surfaces."
      >
        <DCArtboard id="sprite" label="Cat sprite states" width={620} height={300}>
          <SpriteReferenceSpecimen />
        </DCArtboard>
        <DCArtboard id="tokens" label="Tokens" width={540} height={420}>
          <TokensSpecimen />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
