<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cattab Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="page">
    <header class="page__header">
      <h1 class="page__title" data-i18n="optionsTitle">Cattab Settings</h1>
    </header>

    <section class="card">
      <h2 class="section__title" data-i18n="optionsSpeed">Cat speed</h2>
      <div class="slider-row">
        <span>🐢</span>
        <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1" />
        <span>🐇</span>
      </div>
    </section>

    <section class="card">
      <h2 class="section__title" data-i18n="optionsSound">Sound effects</h2>
      <label class="toggle-row">
        <span class="toggle-row__label" data-i18n="optionsSound">Sound</span>
        <div class="toggle">
          <input type="checkbox" id="sound-toggle" />
          <span class="toggle__thumb"></span>
        </div>
      </label>
    </section>

    <section class="card">
      <h2 class="section__title" data-i18n="optionsBlocklist">Hidden sites</h2>
      <div class="add-row">
        <input type="text" id="site-input" placeholder="example.com" class="text-input" />
        <button id="add-btn" class="btn" data-i18n="optionsAddSite">Add site</button>
      </div>
      <ul id="blocklist" class="site-list"></ul>
    </section>
  </main>

  <script src="options.js" type="module"></script>
</body>
</html>
